[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "0.1.0"
description = "Continuously researches football fixtures (form, table, absences, news) and predicts the winner."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
news = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
fp = "football_predictor.cli:main"

[tool.setuptools.packages.find]
include = ["football_predictor*", "updown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
